# The one place for trading costs and strategy settings.
# Read by the Go pipeline (internal/config) and the Python backtester (tomllib).
# Never hard-code a cost or a strategy parameter anywhere else.

[run]
db_path = "data/radar.db"
public_dir = "public"
history_start = "2010-01-01"   # how far back collectors backfill

[costs.tw]
commission_rate = 0.001425     # statutory maximum, charged on buys and sells
broker_discount = 0.6          # fraction of commission you actually pay (0.6 = 6折). Set to your broker's.
min_commission = 20            # NTD per order
sell_tax = 0.003               # securities transaction tax on stock sells
etf_sell_tax = 0.001           # transaction tax on ETF sells (e.g. 0050)
day_trade_sell_tax = 0.0015    # reduced day-trade rate, legislated until 2027-12-31

[backtest]
initial_capital = 5_000_000    # NTD
benchmark = "0050"
design_start = "2012-01-01"    # rules are tuned on this period...
design_end = "2019-12-31"
test_start = "2020-01-01"      # ...and judged on this one
max_adv_fraction = 0.05        # a buy may not make a position bigger than this share of...
adv_days = 20                  # ...its average daily traded value over this many trading days
min_trade_value = 10_000       # NTD; smaller rebalancing trades are skipped (full exits always happen)

# Each strategy adds its own [strategy.<name>] section (see its issue).

[strategy.cycle_bottom]        # issue #19: buy cyclicals as revenue YoY turns up
industries = ["半導體業", "光電業", "航運業", "鋼鐵工業", "塑膠工業"]  # FinMind industry_category
tickers = []                   # extra tickers to include whatever their industry
yoy_window = 3                 # YoY on a trailing 3-month revenue sum (smooths Lunar New Year)
trough_months = 12             # look back this many months before the turn...
min_negative_months = 6        # ...and need at least this many with negative YoY
improve_months = 2             # YoY rose this many months in a row
max_entry_yoy = 10.0           # percent; don't buy once YoY is already above this
rollover_months = 2            # sell when YoY falls this many months in a row
stop_loss = 0.25               # sell if the adjusted close drops this far below the entry close
price_ma_days = 60             # buy only above this moving average (0 = off)
max_positions = 10             # each buy gets 1/max_positions of equity
min_avg_turnover = 20_000_000  # NTD a day...
turnover_days = 20             # ...averaged over this many trading days

[strategy.revenue_momentum]    # issue #18; see backtest/strategies/revenue_momentum.py
top_n = 12                     # names held, equal weight
exit_rank = 30                 # a holding is kept while it ranks this high or better
yoy_months = 3                 # revenue YoY must be strong in each of the last N months...
min_yoy_pct = 10.0             # ...by at least this much (%)
high_days = 252                # 52-week high window, trading days
max_below_high = 0.10          # close must be within 10% of that high
high_weight = 0.5              # score = (1-w) x YoY rank + w x closeness-to-high rank
min_adv_ntd = 10_000_000       # NTD average traded value...
adv_days = 20                  # ...over this many days
revenue_deadline_day = 10      # revenue is due by the 10th; rebalance the trading day after
trust_filter = false           # require 投信 net buying (the script runs both variants)
trust_days = 10                # 投信 net buy summed over this many trading days
stop_loss = 0.15               # sell between rebalances when 15% below the buy-day close
stop_ma_days = 0               # >0 also sells on a close below this moving average

[strategy.dca]                 # issue #20: average down as a stock falls, sell on a small bounce
variant = "martingale"         # default table for `make`; `python3 -m strategies.dca` runs every table
universe_size = 150            # only the most traded common stocks that day (large/mid caps)...
universe_days = 60             # ...by average traded value over this many trading days...
min_avg_turnover = 50_000_000  # ...and at least this many NTD a day
entry_drop = 0.10              # start a cycle when the close is this far below...
entry_high_days = 60           # ...its highest close over this many trading days
max_cycles = 5                 # stocks being averaged down at the same time
base_order = 50_000            # NTD, first buy of a cycle
add_step = 0.05                # buy again each time the close is this far below the last buy
multiplier = 2.0               # add k is base_order x multiplier^k (2 = martingale, 1 = plain DCA)
take_profit = 0.01             # sell all when the close is this far above the average cost
max_adds = 0                   # 0 = no limit
stop_loss = 0.0                # sell all this far below the average cost; 0 = no stop
# Market drawdowns reported separately (TAIEX peak to trough). 2008 is before history_start.
stress_windows = [
  ["2008", "2008-05-19", "2008-11-20"],
  ["2015", "2015-04-28", "2015-08-24"],
  ["2020", "2020-01-14", "2020-03-19"],
  ["2022", "2022-01-05", "2022-10-25"],
]

[strategy.dca.martingale]      # as the owner described it: no cap on adds, no stop

[strategy.dca.capped]          # same, but at most 3 adds and a hard stop
max_adds = 3
stop_loss = 0.20
