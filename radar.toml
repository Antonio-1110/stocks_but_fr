# The one place for trading costs and strategy settings.
# Read by the Go pipeline (internal/config) and the Python backtester (tomllib).
# Never hard-code a cost or a strategy parameter anywhere else.

[run]
db_path = "data/radar.db"
public_dir = "public"
history_start = "2010-01-01"   # how far back collectors backfill

[costs.tw]
commission_rate = 0.001425     # statutory maximum, charged on buys and sells
broker_discount = 0.6          # fraction of commission you actually pay (0.6 = 6折). Set to your broker's.
min_commission = 20            # NTD per order
sell_tax = 0.003               # securities transaction tax on stock sells
etf_sell_tax = 0.001           # transaction tax on ETF sells (e.g. 0050)
day_trade_sell_tax = 0.0015    # reduced day-trade rate, legislated until 2027-12-31

[backtest]
initial_capital = 5_000_000    # NTD
benchmark = "0050"
design_start = "2012-01-01"    # rules are tuned on this period...
design_end = "2019-12-31"
test_start = "2020-01-01"      # ...and judged on this one
max_adv_fraction = 0.05        # a buy may not make a position bigger than this share of...
adv_days = 20                  # ...its average daily traded value over this many trading days
min_trade_value = 10_000       # NTD; smaller rebalancing trades are skipped (full exits always happen)

[limits.tw]                    # issue #53: daily price limits. A buy whose fill-day open is locked at
                               # limit-up is skipped; a sell waits while the open is locked at limit-down.
                               # Both compare the open with the previous close on the adjusted scale.
pct = 0.10                     # limit since `since`...
old_pct = 0.07                 # ...and before it
since = "2015-06-01"
tolerance = 0.005              # a move within this of the limit counts as locked (limit prices round to a tick)

[revenue]
min_coverage = 0.9             # issue #37: paper portfolios and alerts use a revenue month only once this
                               # share of listed stocks has it (a backfill or the filing week isn't the market)

[revenue.low_base]             # YoY off a tiny base is noise: such months are flagged and kept out of rankings
min_base_ntd = 10_000_000      # last year's same-month revenue below this many NTD is a low base...
min_base_ratio = 0.3           # ...as is one below this fraction of the company's average monthly revenue...
typical_months = 12            # ...over this many months before that base month

[site.unpriced]                # dashboard's "growth not yet priced in" ranking (issue #32)
min_growth_pct = 20.0          # needs at least this 3-month average revenue YoY (%)...
min_turnover_ntd = 10_000_000  # ...and this much average daily traded value, NTD
# Score = sum of weight x percentile rank among the eligible stocks (0..1 each):
growth_weight = 0.35           # higher 3-month revenue YoY
accel_weight = 0.15            # latest month's YoY further above the 3-month average (speeding up)
price_weight = 0.2             # smaller 1-month price change
high_weight = 0.15             # further below the 52-week high
flow_weight = 0.15             # less 10-day 投信+外資 net buying, as a share of traded value

[alerts]                       # issue #34: Telegram message when a stock newly passes a rule
# Rules checked on every collect run. Switch to whichever one the backtests prove.
#   revenue_momentum: [strategy.revenue_momentum]'s entry filters and score; a stock
#                     alerts when it enters the top top_n, and can alert again only
#                     after it has fallen out of the top exit_rank.
#   unpriced:         the dashboard's "not yet priced in" ranking ([site.unpriced]).
rules = ["revenue_momentum", "unpriced"]
unpriced_top = 10              # alert when a stock enters the top N of that ranking...
unpriced_exit = 25             # ...and again only after it has fallen below this rank

[paper]                        # issue #35: follow strategies forward on live data, after costs
# One paper portfolio per strategy. Each starts on its first run with initial_capital
# in cash, trades on the close of the latest fully collected trading day, fills at
# the next trading day's open with [costs.tw] fees and tax, and is compared with
# the same money put into the benchmark on its first fill day.
strategies = ["revenue_momentum", "cycle_bottom", "revenue_momentum_foreign",  # the last: issue #67
              "record_revenue", "breakout", "window_dressing", "pullback"]  # issues #70-#73
initial_capital = 5_000_000    # NTD, each portfolio
benchmark = "0050"
min_coverage = 0.9             # a day's prices count as collected once it has this share of the previous day's stocks

# Each strategy adds its own [strategy.<name>] section (see its issue).

[strategy.cycle_bottom]        # issue #19: buy cyclicals as revenue YoY turns up
industries = ["半導體業", "光電業", "航運業", "鋼鐵工業", "塑膠工業"]  # FinMind industry_category
tickers = []                   # extra tickers to include whatever their industry
yoy_window = 3                 # YoY on a trailing 3-month revenue sum (smooths Lunar New Year)
trough_months = 12             # look back this many months before the turn...
min_negative_months = 6        # ...and need at least this many with negative YoY
improve_months = 2             # YoY rose this many months in a row
max_entry_yoy = 10.0           # percent; don't buy once YoY is already above this
rollover_months = 2            # sell when YoY falls this many months in a row
stop_loss = 0.25               # sell if the adjusted close drops this far below the entry close
price_ma_days = 60             # buy only above this moving average (0 = off)
max_positions = 10             # each buy gets 1/max_positions of equity
min_avg_turnover = 20_000_000  # NTD a day...
turnover_days = 20             # ...averaged over this many trading days

[strategy.revenue_momentum]    # issue #18; see backtest/strategies/revenue_momentum.py
top_n = 12                     # names held, equal weight
exit_rank = 30                 # a holding is kept while it ranks this high or better
yoy_months = 3                 # revenue YoY must be strong in each of the last N months...
min_yoy_pct = 10.0             # ...by at least this much (%)
high_days = 252                # 52-week high window, trading days
max_below_high = 0.10          # close must be within 10% of that high
high_weight = 0.5              # score = (1-w) x YoY rank + w x closeness-to-high rank
min_adv_ntd = 10_000_000       # NTD average traded value...
adv_days = 20                  # ...over this many days
revenue_deadline_day = 10      # revenue is due by the 10th; rebalance the trading day after
trust_filter = false           # require 投信 net buying (the script runs both variants)
trust_days = 10                # 投信 net buy summed over this many trading days
stop_loss = 0.15               # sell between rebalances when 15% below the buy-day close
stop_ma_days = 0               # >0 also sells on a close below this moving average

[strategy.dca]                 # issue #20: average down as a stock falls, sell on a small bounce
variant = "martingale"         # default table for `make`; `python3 -m strategies.dca` runs every table
universe_size = 150            # only the most traded common stocks that day (large/mid caps)...
universe_days = 60             # ...by average traded value over this many trading days...
min_avg_turnover = 50_000_000  # ...and at least this many NTD a day
entry_drop = 0.10              # start a cycle when the close is this far below...
entry_high_days = 60           # ...its highest close over this many trading days
max_cycles = 5                 # stocks being averaged down at the same time
base_order = 50_000            # NTD, first buy of a cycle
add_step = 0.05                # buy again each time the close is this far below the last buy
multiplier = 2.0               # add k is base_order x multiplier^k (2 = martingale, 1 = plain DCA)
take_profit = 0.01             # sell all when the close is this far above the average cost
max_adds = 0                   # 0 = no limit
stop_loss = 0.0                # sell all this far below the average cost; 0 = no stop
regime_ticker = "0050"         # issue #65: market trend filter, off unless regime_days > 0:
regime_days = 0                # no new cycle and no add while this closes below its average over these days
# Market drawdowns reported separately (TAIEX peak to trough). 2008 is before history_start.
stress_windows = [
  ["2008", "2008-05-19", "2008-11-20"],
  ["2015", "2015-04-28", "2015-08-24"],
  ["2020", "2020-01-14", "2020-03-19"],
  ["2022", "2022-01-05", "2022-10-25"],
]

[strategy.dca.martingale]      # as the owner described it: no cap on adds, no stop

[strategy.dca.capped]          # same, but at most 3 adds and a hard stop
max_adds = 3
stop_loss = 0.20

[strategy.dca.martingale_trend] # the martingale, but no new stock and no add while 0050 is below its 200-day average
regime_days = 200

[strategy.foreign_flow]        # issue #66: follow 外資, acting at the next open after flows are published
# Shared keys; each sub-table below is one variant. Revenue momentum keys (top_n, exit_rank,
# stop_loss, min_adv_ntd, ...) default to revenue_momentum.py's DEFAULTS and can be set here.
flow_days = 60                 # window: foreign net NTD bought / NTD traded over these trading days
min_buy_share = 0.0            # share of window days foreigners were net buyers
foreign_weight = 0.0           # revenue variant: weight of the foreign rank in the score
ma_days = 0                    # flow variant: close must be above this moving average (0 = off)
# min_intensity = 0.0          # foreign intensity must be above this (unset = no gate)

[strategy.foreign_flow.flow20] # top 12 by 20-day foreign buying, liquid stocks
variant = "flow"
flow_days = 20
min_adv_ntd = 50_000_000

[strategy.foreign_flow.flow60] # same over 60 days
variant = "flow"
min_adv_ntd = 50_000_000

[strategy.foreign_flow.flow60_steady] # ...and net buying on at least 60% of those days
variant = "flow"
min_adv_ntd = 50_000_000
min_buy_share = 0.6

[strategy.foreign_flow.flow60_trend] # ...and above the 60-day average
variant = "flow"
min_adv_ntd = 50_000_000
ma_days = 60

[strategy.foreign_flow.rm_gate20] # revenue momentum, only names foreigners net bought over 20 days
variant = "revenue"
flow_days = 20
min_intensity = 0.0

[strategy.foreign_flow.rm_gate60] # same over 60 days
variant = "revenue"
min_intensity = 0.0

[strategy.foreign_flow.rm_no_dump] # revenue momentum, skipping names foreigners sold hard (>5% of volume) over 60 days
variant = "revenue"
min_intensity = -0.05

[strategy.foreign_flow.rm_score] # revenue momentum with the 60-day foreign rank as a third of the score
variant = "revenue"
foreign_weight = 0.33

[strategy.foreign_flow.rm_plain] # no foreign rule: must match revenue_momentum (sanity check)
variant = "revenue"

# Active strategies (issues #70-#73): a few stocks held for days or weeks, run on
# backtest/strategies/swing.py's order engine. Each buy gets 1/max_positions of equity.

[strategy.record_revenue]      # issue #70: buy record monthly revenue after the deadline, hold ~a month
max_positions = 8
record_months = 36             # newest month above each of the 35 before it
min_yoy_pct = 20.0             # and at least this YoY (%)
min_base_ntd = 10_000_000      # last year's same month at least this (no tiny bases)
min_adv_ntd = 20_000_000       # NTD average traded value...
adv_days = 20                  # ...over this many trading days
hold_days = 20                 # sell after this many trading days, unless it posts another record
trail_stop = 0.10              # or once 10% below its highest close since buying
revenue_deadline_day = 10

[strategy.breakout]            # issue #71: new 55-day high on heavy volume, ride it with a trailing stop
max_positions = 8
breakout_days = 55             # close above the highest close of the previous 55 trading days...
volume_days = 50               # ...with traded value at least volume_mult x its 50-day average
volume_mult = 2.0
min_adv_ntd = 30_000_000
adv_days = 20
regime_ticker = "0050"         # no new buys while 0050 closes below its 200-day average
regime_days = 200
atr_days = 20                  # trailing stop: highest close since buying minus
atr_mult = 3.0                 # atr_mult x the average daily move over atr_days

[strategy.window_dressing]     # issue #72: ride 投信 quarter-end buying, out before the quarter closes
quarters = [3, 6, 9, 12]       # quarter-end months traded
entry_days = 28                # buy once the quarter end is this many calendar days away or less...
exit_days = 3                  # ...sell everything once it is this close
flow_days = 20                 # rank by 投信 net NTD bought / NTD traded over this many trading days
max_positions = 10
min_adv_ntd = 20_000_000
adv_days = 20
skip_largest = 100             # leave out the 100 most traded stocks: small and mid caps only
stop_loss = 0.10

[strategy.pullback]            # issue #73: buy sharp dips in strong uptrends, sell on the bounce
max_positions = 10
min_adv_ntd = 30_000_000
adv_days = 20
trend_days = 200               # close above its 200-day average...
strength_days = 120            # ...and in the top strength_pct of liquid stocks by 120-day return
strength_pct = 0.2
rsi_days = 2
entry_rsi = 10.0               # buy when RSI(2) is below this, most oversold first
exit_ma_days = 5               # sell when the close is back above its 5-day average...
max_hold_days = 10             # ...or after 10 trading days
stop_loss = 0.10
