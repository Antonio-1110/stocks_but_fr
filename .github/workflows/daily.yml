# Scheduled run: collect Taiwan data into SQLite, render the dashboard, and
# publish public/ to GitHub Pages.
#
# The database lives between runs as an asset on a release tagged `data`
# (not in git, so history doesn't grow; each run replaces the one asset).
# Anyone can download it there to run the backtester locally:
#   gh release download data --pattern radar.db.gz && gunzip radar.db.gz
#
# Pages must be set to deploy from Actions once, by hand:
#   Settings > Pages > Build and deployment > Source: GitHub Actions

name: daily

on:
  schedule:
    # Hourly, off the top of the hour. A run spends this run's FinMind budget
    # in about an hour, so back-to-back runs keep backfills moving; once data
    # is current, runs have little to fetch. 11:17 UTC is 19:17 Taipei, after
    # the close and the 三大法人 report.
    - cron: "17 * * * *"
  workflow_dispatch:

env:
  DATA_TAG: data
  DB_ASSET: radar.db.gz
  PREV_ASSET: radar.prev.db.gz   # the copy before the latest run
  STATE_ASSET: state.db.gz       # paper portfolios and alert state (#46)
  STATE_PREV: state.prev.db.gz
  TZ: Asia/Taipei

jobs:
  # Code that fails its tests never collects into the saved database (#43).
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  run:
    needs: test
    runs-on: ubuntu-latest
    # Runs never overlap: two runs would race on the database asset.
    concurrency:
      group: daily
      cancel-in-progress: false
    # Each collector paces FinMind for up to about an hour per run.
    timeout-minutes: 300
    permissions:
      contents: write   # create the `data` release and replace its asset
      actions: write    # start the next run while a backfill is incomplete
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o radar ./cmd/radar

      # A missing release means this is the first run: start empty. A release
      # whose download fails stops the job, so a fresh empty database never
      # replaces the real one.
      - name: Restore database
        run: |
          mkdir -p data
          if ! assets=$(gh release view "$DATA_TAG" --json assets -q '.assets[].name' 2>&1); then
            if grep -q "release not found" <<<"$assets"; then
              echo "No '$DATA_TAG' release yet; starting with an empty database"
              exit 0
            fi
            echo "$assets"
            exit 1
          fi
          # .new is left behind only if a previous save stopped halfway. It
          # was uploaded after validation passed, so it is the newest good
          # copy (#49).
          for name in "$DB_ASSET.new" "$DB_ASSET"; do
            if grep -qxF "$name" <<<"$assets"; then
              gh release download "$DATA_TAG" --pattern "$name" --output data/radar.db.gz
              gunzip data/radar.db.gz
              ls -lh data/radar.db
              exit 0
            fi
          done
          echo "Release '$DATA_TAG' has no database asset; starting empty"

      # Paper portfolios and alert state live in data/state.db, saved apart
      # from market data so a market-data rollback doesn't rewind them. With
      # no saved copy, the first run moves the tables out of radar.db; once
      # they have been moved, a missing copy stops the run instead of
      # silently starting the portfolios over.
      - name: Restore state
        run: |
          assets=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DATA_TAG" -q '.assets[].name' 2>/dev/null || true)
          for name in "$STATE_ASSET.new" "$STATE_ASSET"; do
            if grep -qxF "$name" <<<"$assets"; then
              gh release download "$DATA_TAG" --pattern "$name" --output data/state.db.gz
              gunzip data/state.db.gz
              ls -lh data/state.db
              exit 0
            fi
          done
          if [ -f data/radar.db ] && python3 -c "import sqlite3,sys; sys.exit(0 if sqlite3.connect('data/radar.db').execute(\"SELECT 1 FROM sqlite_master WHERE name='paper_portfolios'\").fetchone() else 1)"; then
            echo "No saved state yet; this run moves it out of radar.db"
          elif [ -f data/radar.db ] && [ -s data/radar.db ]; then
            echo "::error::$STATE_ASSET is missing from the release. Rename $STATE_PREV to $STATE_ASSET to restore it."
            exit 1
          else
            echo "Starting with empty state"
          fi

      # Alerts are only queued here; "Send alerts" sends them after saving.
      - name: Collect
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          set -o pipefail
          ./radar collect 2>&1 | tee collect.log

      # Hard checks (prices sane, no rows lost, no date going backwards since
      # the last snapshot) stop the job here, before anything is uploaded.
      # On a pass the manifest is stored in the database's snapshots table
      # and in data/manifest.json (issue #44).
      - name: Validate
        run: ./radar validate

      # Upload under a temporary name, then swap, so a failed upload never
      # leaves the release without a database.
      - name: Save database
        run: |
          python3 - <<'EOF'
          import sqlite3
          db = sqlite3.connect("data/radar.db")
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          ok = db.execute("PRAGMA quick_check").fetchone()[0]
          if ok != "ok":
              raise SystemExit(f"database check failed: {ok}")
          db.execute("PRAGMA journal_mode=DELETE")  # fold the WAL into the file
          db.close()
          EOF
          # The state database (#46) is checked and compressed the same way.
          python3 - <<'EOF'
          import sqlite3
          db = sqlite3.connect("data/state.db")
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          ok = db.execute("PRAGMA quick_check").fetchone()[0]
          if ok != "ok":
              raise SystemExit(f"state check failed: {ok}")
          db.execute("PRAGMA journal_mode=DELETE")
          db.close()
          EOF
          # GitHub answers the odd release call with a 5xx; retry (#49).
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; return 1; }
          # A DELETE that errored but went through leaves nothing to retry.
          del_asset() { retry gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$1" || ! gh api "repos/$GITHUB_REPOSITORY/releases/assets/$1" >/dev/null 2>&1; }
          gzip -c data/state.db > "$STATE_ASSET.new"
          gzip -c data/radar.db > "$DB_ASSET.new"
          ls -lh data/radar.db "$DB_ASSET.new"
          if ! gh release view "$DATA_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_TAG" --prerelease --title "Data snapshot" \
              --notes "Latest data/radar.db, replaced by the daily workflow. Not a software release."
          fi
          asset_id() { awk -v n="$1" '$2 == n { print $1 }' <<<"$assets"; }
          rename() { retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$1" -f name="$2" >/dev/null; }
          # State first (#46): if the run stops before the database swap, the
          # next run restores the older database with this state, which is
          # safe; the other way round could leave moved tables in neither.
          retry gh release upload "$DATA_TAG" "$STATE_ASSET.new" --clobber
          assets=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DATA_TAG" -q '.assets[] | "\(.id) \(.name)"')
          old=$(asset_id "$STATE_ASSET")
          if [ -n "$old" ]; then
            prev=$(asset_id "$STATE_PREV")
            if [ -n "$prev" ]; then
              del_asset "$prev"
            fi
            rename "$old" "$STATE_PREV"
          fi
          rename "$(asset_id "$STATE_ASSET.new")" "$STATE_ASSET"
          retry gh release upload "$DATA_TAG" "$DB_ASSET.new" --clobber
          # The manifest describes the copy just uploaded, plus its checksum.
          jq --arg sha "$(sha256sum "$DB_ASSET.new" | cut -d' ' -f1)" '. + {gz_sha256: $sha}' \
            data/manifest.json > manifest.json
          retry gh release upload "$DATA_TAG" manifest.json --clobber
          # Nothing is deleted until a newer copy exists (issue #38): the copy
          # this run replaces becomes $PREV_ASSET (one run back), and the first
          # run of each Taipei day also keeps a dated copy for a week. To roll
          # back, see README "Daily run".
          assets=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DATA_TAG" -q '.assets[] | "\(.id) \(.name)"')
          old=$(asset_id "$DB_ASSET")
          if [ -n "$old" ]; then
            prev=$(asset_id "$PREV_ASSET")
            if [ -n "$prev" ]; then
              del_asset "$prev"
            fi
            rename "$old" "$PREV_ASSET"
          fi
          rename "$(asset_id "$DB_ASSET.new")" "$DB_ASSET"
          daily="radar-$(date +%F).db.gz"
          if [ -z "$(asset_id "$daily")" ]; then
            mv "$DB_ASSET.new" "$daily"
            retry gh release upload "$DATA_TAG" "$daily"
          fi
          cutoff="radar-$(date -d '7 days ago' +%F).db.gz"
          while read -r id name; do
            if [[ $name =~ ^radar-[0-9]{4}-[0-9]{2}-[0-9]{2}\.db\.gz$ && $name < $cutoff ]]; then
              echo "Deleting old snapshot $name"
              del_asset "$id"
            fi
          done <<<"$assets"

      # Telegram goes out only now that the state with the queued alerts is
      # saved, so a failed save can't lead to the same alert twice (#47).
      # Then the state is saved again so the sent marks stick; that upload
      # replaces state.db.gz and keeps state.prev.db.gz as it is.
      - name: Send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ./radar notify

      - name: Save state
        run: |
          python3 - <<'EOF'
          import sqlite3
          db = sqlite3.connect("data/state.db")
          db.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          ok = db.execute("PRAGMA quick_check").fetchone()[0]
          if ok != "ok":
              raise SystemExit(f"state check failed: {ok}")
          db.execute("PRAGMA journal_mode=DELETE")
          db.close()
          EOF
          # GitHub answers the odd release call with a 5xx; retry (#49).
          retry() { for i in 1 2 3 4; do "$@" && return 0; echo "retry $i: $*"; sleep $((i * 10)); done; return 1; }
          # A DELETE that errored but went through leaves nothing to retry.
          del_asset() { retry gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$1" || ! gh api "repos/$GITHUB_REPOSITORY/releases/assets/$1" >/dev/null 2>&1; }
          gzip -c data/state.db > "$STATE_ASSET.new"
          retry gh release upload "$DATA_TAG" "$STATE_ASSET.new" --clobber
          assets=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DATA_TAG" -q '.assets[] | "\(.id) \(.name)"')
          asset_id() { awk -v n="$1" '$2 == n { print $1 }' <<<"$assets"; }
          old=$(asset_id "$STATE_ASSET")
          if [ -n "$old" ]; then
            del_asset "$old"
          fi
          retry gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$(asset_id "$STATE_ASSET.new")" -f name="$STATE_ASSET" >/dev/null

      # GitHub starts few of the hourly scheduled runs, so while a backfill is
      # incomplete each run starts the next one. The `daily` group keeps at
      # most one running and one queued, and the FinMind client paces requests
      # under the hourly limit across back-to-back runs. Chaining stops once no
      # collector reports work left.
      - name: Start the next run if a backfill is incomplete
        run: |
          if grep -qE 'FinMind: stopping:|budget or quota reached|TPEx: fetched [0-9]+ days, [1-9][0-9]* left' collect.log; then
            echo "Backfill incomplete; starting the next run"
            gh workflow run daily.yml --ref "$GITHUB_REF_NAME"
          else
            echo "Nothing left to backfill; not chaining"
          fi

      - name: Render
        run: ./radar render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: run
    runs-on: ubuntu-latest
    # Shared with publish.yml so two Pages deploys never collide.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
